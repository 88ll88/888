<script>
function 單双(x){return x.map(num => (parseInt(num) % 2 !== 0 ? "單" : "双")).join("");}
function 和值(x){return x.reduce((sum, num) => sum + Number(num), 0);}
function 均值(x){return Math.floor(x.reduce((acc, cur) => acc + Number(cur), 0)/5)};
function 首尾差(x){return Math.max(...x) - Math.min(...x);};
function 首數和(x){return x.reduce((sum, num) => sum + Math.floor(Number(num) / 10), 0);}
function 尾數和(x){return x.reduce((sum, num) => sum + (Number(num) % 10), 0);}
function 同尾(x){
    var counts = {};
    x.forEach(num=>{let tail=Number(num)%10;counts[tail]=(counts[tail] || 0)+1;});
    var result = Object.entries(counts)
        .filter(([tail, count]) => count >= 2)
        .map(([tail, count]) => `${tail}×${count}`)
        .join('｜');
    return result;
}
function 連號(x) {
     var sorted = x.map(Number).sort((a, b) => a - b);
     var sequences = [];
     var temp = [sorted[0]];
     for (let i = 1; i < sorted.length; i++) {
             if (sorted[i] === sorted[i - 1] + 1) {
                  temp.push(sorted[i]);
             } else {
                         if (temp.length >= 2) sequences.push(temp.map(n => String(n).padStart(2, '0')).join('+'));                         
                         temp = [sorted[i]];
             }
      }        
      if (temp.length >= 2) sequences.push(temp.map(n => String(n).padStart(2, '0')).join('+'));      
      return (sequences.join('｜') || "");
}
</script>
