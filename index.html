<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            color: #333;
        }
        input[type="password"] {
            width: 620px;
            max-width: 100%;
            margin-bottom: 10px;
            padding: 4px;
            font-family: monospace;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }
        textarea {
            width: 620px;
            max-width: 100%;
            height: 48px;
            overflow-y: hidden;
            resize: none;
            font-family: monospace;
            font-size: 14px;
            padding: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }
        pre {
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            margin-top: 15px;
            width: 620px;
            max-width: 100%;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 8px;
            box-sizing: border-box;
        }
        .status-box {
            font-family: monospace;
            font-size: 14px;
            margin-top: 15px;
            padding: 4px;
            width: 620px;
            max-width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div>
        <input type="password" id="githubToken" placeholder="GitHub Token" oninput="saveToken()">
    </div>

    <div>
        <textarea id="inputData" placeholder="請在此貼上資料..." oninput="handleInput(this)" onpaste="handlePaste(event)"></textarea>
    </div>

    <div id="statusResult" class="status-box">尚未執行...</div>

    <pre id="statusLog">等待輸入...</pre>

<script>
    const GH_ACCOUNTS = [
        { GH_OWNER: '88l88', GH_REPO: '888', GH_PATH: 'ddd.js' },
        { GH_OWNER: '88ll88', GH_REPO: '888', GH_PATH: 'ddd.js' }
    ];

    window.onload = function() {
        const savedToken = localStorage.getItem('my_github_token');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
        }
    };

    function saveToken() {
        const token = document.getElementById('githubToken').value.trim();
        localStorage.setItem('my_github_token', token);
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    function encodeUTF8(str) {
        return btoa(unescape(encodeURIComponent(str)));
    }

    function decodeUTF8(base64Str) {
        return decodeURIComponent(escape(atob(base64Str.replace(/\s/g, ''))));
    }

    let isProcessing = false;

    function handlePaste(event) {
        setTimeout(() => {
            if (!isProcessing) {
                processAndUpdate();
            }
        }, 100);
    }

    function handleInput(textarea) {
        autoResize(textarea);
    }

    async function processAndUpdate() {
        if (isProcessing) return;

        const tokenInput = document.getElementById('githubToken').value.trim();
        const inputArea = document.getElementById('inputData');
        const rawText = inputArea.value.trim();
        const statusResult = document.getElementById('statusResult');
        const statusLog = document.getElementById('statusLog');

        if (!tokenInput || !rawText) return;

        isProcessing = true;
        statusResult.textContent = '處理中...';

        const lines = rawText.split('\n');
        let parsedEntries = [];

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            const parts = line.split(/\s+/);
            
            // 找出日期 (YYYY-MM-DD)
            let dateStr = '';
            let dateIdx = -1;
            for (let i = 0; i < parts.length; i++) {
                if (/^\d{4}-\d{2}-\d{2}$/.test(parts[i])) {
                    dateStr = parts[i];
                    dateIdx = i;
                    break;
                }
            }

            if (dateIdx !== -1) {
                // 從日期之後尋找連續 5 個兩位數的球號
                let balls = [];
                for (let j = dateIdx + 1; j < parts.length; j++) {
                    if (/^\d{1,2}$/.test(parts[j])) {
                        balls.push(parts[j].padStart(2, '0'));
                        if (balls.length === 5) break;
                    }
                }

                if (dateStr && balls.length === 5) {
                    parsedEntries.push({ date: dateStr, balls: balls });
                }
            }
        }

        if (parsedEntries.length === 0) {
            statusResult.textContent = '解析失敗';
            isProcessing = false;
            return;
        }

        parsedEntries.sort((a, b) => b.date.localeCompare(a.date));

        let successCount = 0;
        let latestFullContent = '';

        for (let acc of GH_ACCOUNTS) {
            try {
                const res = await fetch(`https://api.github.com/repos/${acc.GH_OWNER}/${acc.GH_REPO}/contents/${acc.GH_PATH}`, {
                    headers: {
                        'Authorization': `token ${tokenInput}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!res.ok) throw new Error('讀取失敗');
                const fileData = await res.json();
                const content = decodeUTF8(fileData.content);

                const match = content.match(/var\s+ddd\s*=\s*\[([\s\S]*?)\];/);
                if (!match) throw new Error('找不到陣列');

                const existingContent = match[1].trim();

                let existingDatesMatch = existingContent.match(/'(\d{4}-\d{2}-\d{2})'/);
                let latestExistingDate = existingDatesMatch ? existingDatesMatch[1] : '';

                let validNewEntries = parsedEntries.filter(item => {
                    return !latestExistingDate || item.date > latestExistingDate;
                });

                let uniqueMap = new Map();
                validNewEntries.forEach(item => uniqueMap.set(item.date, item.balls));
                
                let finalNewEntries = [];
                uniqueMap.forEach((balls, date) => {
                    finalNewEntries.push({ date: date, balls: balls });
                });

                finalNewEntries.sort((a, b) => b.date.localeCompare(a.date));

                let formattedNewLines = finalNewEntries.map(item => `['${item.date}',['${item.balls[0]}','${item.balls[1]}','${item.balls[2]}','${item.balls[3]}','${item.balls[4]}']],`).join('\n');

                const newDddContent = `var ddd=[\n` + (formattedNewLines ? formattedNewLines + (existingContent ? '\n' : '') : '') + existingContent + `\n];`;
                latestFullContent = content.replace(/var\s+ddd\s*=\s*\[[\s\S]*?\];/, newDddContent);

                const updateRes = await fetch(`https://api.github.com/repos/${acc.GH_OWNER}/${acc.GH_REPO}/contents/${acc.GH_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${tokenInput}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Update ddd.js`,
                        content: encodeUTF8(latestFullContent),
                        sha: fileData.sha
                    })
                });

                if (updateRes.ok) {
                    successCount++;
                }

            } catch (err) {
                // 不動
            }
        }

        if (successCount === GH_ACCOUNTS.length) {
            const matchFinal = latestFullContent.match(/var\s+ddd\s*=\s*\[([\s\S]*?)\];/);
            if (matchFinal) {
                let innerLines = matchFinal[1].trim().split('\n').filter(l => l.trim() !== '');
                let countToTake = parsedEntries.length;
                let topLines = innerLines.slice(0, countToTake);
                
                statusLog.textContent = topLines.join('\n');
            } else {
                statusLog.textContent = '';
            }

            statusResult.textContent = `88l88 OK 88ll88 OK`;

            inputArea.value = '';
            inputArea.style.height = '48px';
        } else {
            statusResult.textContent = '更新失敗';
        }

        isProcessing = false;
    }
</script>

</body>
</html>
