<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>539 自動更新 ddd.js 工具</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    input, button, textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    textarea { height: 180px; }
  </style>
</head>
<body>

  <h2>今彩539 自動抓取與 GitHub 更新工具</h2>

  <label>GitHub Personal Access Token (PAT):</label>
  <input type="password" id="ghToken" placeholder="請貼上 ghp_xxxxxxxxxxxx">

  <label>GitHub 帳號 / 儲存庫名稱:</label>
  <input type="text" id="ghRepo" value="88ll88/888">

  <button onclick="fetchAndPush()">1. 抓取最新開獎資料並更新至 GitHub</button>

  <h3>執行紀錄：</h3>
  <textarea id="log" readonly></textarea>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbztQN0H72SHHNBYQDlJLsS6G3R8osV_C5c2LM1NxoI6c9W-aPS41oJHLaTc8M9hiYpQhA/exec";

    function log(msg) {
      document.getElementById('log').value += msg + "\n";
    }

    async function fetchAndPush() {
      const token = document.getElementById('ghToken').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();

      if (!token || !repo) {
        alert("請先輸入 GitHub Token 與 Repo 名稱！");
        return;
      }

      log("開始從 9800 抓取資料...");

      try {
        const res = await fetch(GAS_URL, { redirect: "follow" });
        const fetchedText = await res.text();
        log("抓取成功！取得最新開獎內容：\n" + fetchedText);

        const filePath = "ddd.js";
        const ghApiUrl = `https://api.github.com/repos/${repo}/contents/${filePath}`;
        
        log("正在向 GitHub 查詢 ddd.js 現有狀態...");
        const getFileRes = await fetch(ghApiUrl, {
          headers: { "Authorization": `token ${token}` }
        });

        let sha = "";
        let currentContent = "";
        if (getFileRes.ok) {
          const fileData = await getFileRes.json();
          sha = fileData.sha;
          currentContent = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
        }

        const updatedContent = fetchedText + "\n" + currentContent;

        log("正在提交更新至 GitHub...");
        const putRes = await fetch(ghApiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Auto-update ddd.js",
            content: btoa(unescape(encodeURIComponent(updatedContent))),
            sha: sha
          })
        });

        if (putRes.ok) {
          log("🎉 GitHub ddd.js 更新成功！");
        } else {
          const errData = await putRes.json();
          log("❌ GitHub 更新失敗：" + errData.message);
        }

      } catch (err) {
        log("❌ 發生錯誤：" + err.message);
      }
    }
  </script>
</body>
</html>
