<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ddd.js 更新工具</title>
    <style>
        body { font-family: monospace; padding: 15px; max-width: 600px; margin: 0 auto; }
        .row { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 6px; }
        #inputData { height: 60px; }
        #last5Box { height: 120px; background: #1a1a2e; color: #ffdd57; font-weight: bold; }
        button { width: 100%; padding: 10px; font-size: 16px; font-weight: bold; background: #28a745; color: white; border: none; cursor: pointer; }
        #msg { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="row">
    <label>0. Token：</label>
    <input type="text" id="tokenInput" onchange="saveToken()">
</div>

<div class="row">
    <label>1. 貼上資料：</label>
    <textarea id="inputData" placeholder="貼上資料..."></textarea>
</div>

<div class="row">
    <button onclick="doUpdate()">OK 更新</button>
</div>

<!-- 最新 5 列顯示框 -->
<div class="row" id="last5Row" style="display:none;">
    <label style="color: #d9534f;">最新 5 列：</label>
    <textarea id="last5Box" readonly></textarea>
</div>

<div id="msg"></div>

<script>
    const OWNER = "88ll88";
    const REPO = "888";
    const FILE_PATH = "ddd.js";

    window.onload = function() {
        const savedToken = localStorage.getItem("github_token_ddd");
        if (savedToken) document.getElementById("tokenInput").value = savedToken;
    };

    function saveToken() {
        localStorage.setItem("github_token_ddd", document.getElementById("tokenInput").value.trim());
    }

    async function doUpdate() {
        const token = document.getElementById("tokenInput").value.trim().replace(/[^\x00-\x7F]/g, "");
        const rawText = document.getElementById('inputData').value.trim();
        const msgDiv = document.getElementById('msg');
        
        if (!token) { msgDiv.style.color = "red"; msgDiv.innerHTML = "請輸入 Token！"; return; }
        if (!rawText) { msgDiv.style.color = "red"; msgDiv.innerHTML = "請貼上資料！"; return; }

        msgDiv.style.color = "blue";
        msgDiv.innerHTML = "更新中...";

        let inputMap = new Map();
        let regTight = /(\d{4}-\d{2}-\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})/g;
        let tm;
        while ((tm = regTight.exec(rawText)) !== null) {
            inputMap.set(tm[1], [tm[7], tm[8], tm[9], tm[10], tm[11]]);
        }

        if (inputMap.size === 0) {
            let blocks = rawText.split(/(?=第?\d{6,10}期|開獎日期)/g);
            for (let block of blocks) {
                let dm = block.match(/(?:開獎日期[:\s]*)?(\d{3}\/\d{2}\/\d{2}|\d{4}-\d{2}-\d{2})/);
                if (dm) {
                    let d = dm[1];
                    let formattedDate = d;
                    let parts = d.match(/(\d{3})\/(\d{2})\/(\d{2})/);
                    if (parts) formattedDate = `${parseInt(parts[1]) + 1911}-${parts[2]}-${parts[3]}`;

                    let nums = [];
                    for (let line of block.split('\n')) {
                        line = line.trim();
                        if (/^\d{2}$/.test(line)) nums.push(line);
                    }
                    if (nums.length >= 5) inputMap.set(formattedDate, nums.slice(-5));
                }
            }
        }

        try {
            let res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?t=${Date.now()}`, {
                headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (!res.ok) throw new Error("讀取失敗");

            let fileData = await res.json();
            let rawOldContent = decodeURIComponent(escape(atob(fileData.content)));

            let tailCode = "";
            let endArrIndex = rawOldContent.indexOf("];");
            if (endArrIndex !== -1) tailCode = rawOldContent.substring(endArrIndex + 2).trim();

            let existingMap = new Map();
            let rowRegex = /['"](\d{4}-\d{2}-\d{2})['"]\s*,\s*\[\s*['"](\d{2})['"]\s*,\s*['"](\d{2})['"]\s*,\s*['"](\d{2})['"]\s*,\s*['"](\d{2})['"]\s*,\s*['"](\d{2})['"]\s*\]/g;
            let rm;
            while ((rm = rowRegex.exec(rawOldContent)) !== null) {
                existingMap.set(rm[1], [rm[2], rm[3], rm[4], rm[5], rm[6]]);
            }

            for (let [date, nums] of inputMap.entries()) {
                existingMap.set(date, nums);
            }

            let sortedDates = Array.from(existingMap.keys()).sort((a, b) => b.localeCompare(a));
            let formattedRows = sortedDates.map(d => `['${d}',[${existingMap.get(d).map(n=>`'${n}'`).join(',')}]]`);

            let finalContent = `var ddd=[\n${formattedRows.join(',\n')}\n];\n` + (tailCode ? tailCode + "\n" : "");

            let putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `更新 ddd 資料`,
                    content: btoa(unescape(encodeURIComponent(finalContent))),
                    sha: fileData.sha
                })
            });

            if (putRes.ok) {
                msgDiv.style.color = "green";
                msgDiv.innerHTML = "更新成功！";
                
                // 加 5 列：印出最新 5 期日期與號碼
                let top5 = sortedDates.slice(0, 5).map(d => `['${d}',[${existingMap.get(d).map(n=>`'${n}'`).join(',')}]]`).join(',\n') + ',';
                document.getElementById('last5Box').value = top5;
                document.getElementById('last5Row').style.display = "block";
                document.getElementById('inputData').value = "";
            } else {
                throw new Error("寫入失敗");
            }
        } catch (e) {
            msgDiv.style.color = "red";
            msgDiv.innerHTML = "錯誤：" + e.message;
        }
    }
</script>

</body>
</html>
