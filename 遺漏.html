<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://88ll88.github.io/888/ddd.js"></script>
    <style>
        /* 表格容器與基本樣式 */
        #table-container {
            width: 1200px;
            margin: auto auto; 
        }

        table {
            border-collapse: collapse;
            table-layout: fixed; /* 鎖定欄位寬度 */
            width: 1200px;
            background: #000;
            color: white;
            text-align: center;
            font-size: 15px;
        }

        /* 統一高度設定 */
        tr {
            height: 25px;
        }

        td {
            border: 0.5px solid white;
            height: 25px;
            line-height: 25px; /* 文字垂直置中 */
            padding: 0;
            box-sizing: border-box;
        }

        /* 號碼區背景顏色分區 (可選) */
        .bg-zone { width: 25px; }

        /* 最後一欄空白補償 */
        .empty-zone {
            border: none;
            background-color: transparent;
        }
    </style>
</head>
<body>
<!-- 直接引入腳本，它會自動生成導航列並標記當前頁面 -->
<script src="nav.js"></script>
<!-- 導航列區塊 -->


<!-- 表格區塊 -->
<div id="table-container">
    <table>
    <thead>
        <tr>
            <th style="width: 100px;">日期</th>
            <th style="width: 100px;">開獎號碼</th>
            <!-- JavaScript 自動產生 01-39 欄位 -->
            <script>
                var cells = '';
                for (var i = 1; i <= 39; i++) {
                    cells += '<td class="bg-zone">' + String(i).padStart(2, "0") + '</td>';
                }
                document.write(cells);
            </script>
            <td style="width: 25px;">#</td>

        </tr>
    </table>
</div>
<script>



</script>
</body>
</html>
