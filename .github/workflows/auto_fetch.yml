name: Auto Fetch Lottery Data

on:
  schedule:
    # 台灣時間每天晚上 20:35, 20:50, 21:05 嘗試自動執行抓取
    - cron: '35 12 * * *'
    - cron: '50 12 * * *'
    - cron: '05 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動點按按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 執行自動抓取腳本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch.py
