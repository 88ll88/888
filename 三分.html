<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script src="https://88ll88.github.io/888/ddd.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 基礎佈局 */
        #table-container { 
               width: 1200px; 
               margin: auto;
        }
        table { 
               border-collapse: collapse; 
               table-layout: fixed; 
               width: 1200px;     
               text-align: center; 
               font-size: 15px; 
        }
        tr { height: 25px; }
        td { 
                border: 0.5px solid #fff; 
                padding: 0; 
                box-sizing: border-box; 
                line-height: 25px; 
         }

        /* 分區底色 */
        .h-zone-1 { background-color: #0000FF; color: white; } 
        .h-zone-2 { background-color: #008000; color: white; } 
        .h-zone-3 { background-color: #FF8C00; color: white; } 
        .b-zone-1 { background-color: #E6E6FF; } 
        .b-zone-2 { background-color: #E6FFE6; } 
        .b-zone-3 { background-color: #FFF2E6; } 
        
        .sat-red { color: #e31919; font-weight: bold; }
        .sat-green { color: #57b31b; font-weight: bold; }

        /* 實心紅圈 */
        .num-solid-red {
            display: inline-block; width: 22px; height: 22px; line-height: 22px;
            background-color: red; border-radius: 50%; color: white; font-weight: bold;
        }

        /* 新增：底部黑底列樣式 */
        
        
        
        .bottom-nav { background-color: #000 !important; color: #fff !important; font-weight: bold; }
        .bottom-nav td { border: 1px solid #fff !important; }
        .footer-row { background: #000; color: #fff; font-weight: bold; }
        .footer-row td { border: 1px solid #fff; } /* 黑底配白線，才有框的感覺 */
        .flex-space { display: flex; justify-content: space-between; padding: 0 5px; }
        .no-border { border: none !important; background: #fff !important; }
    </style>
</head>
<body>
<script src="nav.js"></script>
<div id="table-container">
    <table>
        <thead>
            <tr style="background:#000; color:#fff;">
                <td style="width: 100px">日期</td>
                <td style="width: 100px">開獎號碼</td>
                <script>
                    for (var i = 1; i <= 39; i++) {
                        var hClass = (i <= 13) ? 'h-zone-1' : (i <= 26 ? 'h-zone-2' : 'h-zone-3');
                        document.write(`<td class="${hClass}" style="width: 25px">${String(i).padStart(2, "0")}</td>`);
                    }
                </script>
                <td style="width: 25px">#</td>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
        <tfoot>
            <tr class="foot">
                <td colspan=2 style="width: 200px">新增${count}期</td>
                <script>
                    for (var q = 1; q <= 39; q++) {
                        document.write(`<td style="width: 25px">${String(q).padStart(2, "0")}</td>`);
                    }
                </script>
                <td style="width: 25px"></td>
            </tr>
            <tr class="bottom-nav">
                <td colspan=2 style="width: 200px"></td>
                <script>
                    for (var q = 1; q <= 39; q++) {
                        document.write(`<td style="width: 25px">${String(q).padStart(2, "0")}</td>`);
                    }
                </script>
                <td style="width: 25px"></td>
            </tr>
        </tfoot>
    </table>
</div>

<script>

function renderTable() {
    var tbody = document.getElementById('data-body');
    var html = '';
    var ss = Array(40).fill(0); // 用來存 01-39 的總次數
    if (typeof zzz !== 'undefined') {
        
        for (var j = 0; j < 25; j++) {
            var row = zzz[j];
            var dateStr = row[0];
            var aryNums = row[1];
            var cls = j == 0 ? 'sat-red' : (dateStr.includes("六") ? 'sat-green' : '');                    
            html += '<tr>';
            html += `<td class="${cls}" style="background:#fff; width:200px;">${dateStr}</td>`;
            html += `<td class="${cls}" style="background:#fff; width:100px;">${aryNums.join(",")}</td>`;
            
            for (var n = 1; n <= 39; n++) {
                var target = String(n).padStart(2, '0');
                var bClass = (n <= 13) ? 'b-zone-1' : (n <= 26 ? 'b-zone-2' : 'b-zone-3');
                if (aryNums.includes(target)) {
                    html += `<td class="${bClass}"><span class="num-solid-red">${target}</span></td>`;
                } else {
                    html += `<td class="${bClass}"></td>`;
                }
            }
            aryNums.forEach(nn=>{ss[nn]++});
            html += `<td style="background:#fff; width:25px;">${j + 1}</td>`;
            html += '</tr>';
            var td='';
            td+='<tr>';
            td+='<td style="width:200px"></td>';
            for (var w=1;w<=39;w++) {
                    td+='<td style="width:25px;">' + String(w).padStart (2,"0") + '</td>';
                    ss[j]++;
             }
            td+='<td style="width:25px"></td>';
            td+='<tr>';
         }   
             
        tbody.innerHTML = html;
        document.write(arynums.includes(1));
    }
    
}
window.onload = renderTable;


</script>
</body>
</html>
