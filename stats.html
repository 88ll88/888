<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>539 統計表</title>
    <style>
        body { font-family: monospace; margin: 10px; }
        .row { display: flex; height: 20px; line-height: 20px; text-align: center; font-size: 12px; }
        .cell { border: 1px solid #ccc; box-sizing: border-box; overflow: hidden; white-space: nowrap; }
        .w100 { width: 100px; flex-shrink: 0; }
        .w200 { width: 200px; flex-shrink: 0; }
        /* 標題：黑底白字 */
        .header { background: #000; color: #fff; font-weight: bold; }
        .header .cell { border: 1px solid #fff; }
        /* 第 11 列：平均列 */
        .avg-row { background: #eee; font-weight: bold; }
    </style>
</head>
<body>

<div style="background:#ddd; padding:5px; margin-bottom:5px; width:fit-content;">[統計]</div>

<div id="table-area"></div>

<!-- 1. 先引入你的數據檔 -->
<script src="ddd.js"></script>

<script>
// 2. 檢查 zzz 是否存在，如果不存在就顯示錯誤訊息
if (typeof zzz === 'undefined') {
    document.getElementById('table-area').innerHTML = "錯誤：找不到 zzz 數據，請檢查 ddd.js 內容。";
} else {
    renderTable();
}

function renderTable() {
    let html = '';
    
    // 標題列：10個 w100
    html += `
        <div class="row header">
            <div class="cell w100">日期</div>
            <div class="cell w100">開獎號碼</div>
            <div class="cell w100">單双</div>
            <div class="cell w100">和值</div>
            <div class="cell w100">均值</div>
            <div class="cell w100">首尾差</div>
            <div class="cell w100">首數和</div>
            <div class="cell w100">尾數和</div>
            <div class="cell w100">同尾</div>
            <div class="cell w100">連號</div>
            <div class="cell w200" style="border:none;"></div>
        </div>`;

    // 3. 直接用你的 zzz 跑前 20 筆
    for (let i = 0; i < 20; i++) {
        if (!zzz[i]) break;

        // 第 11 列插入平均列 (索引 10)
        if (i === 10) {
            html += `
                <div class="row avg-row">
                    <div class="cell w200">平均</div>
                    <div class="cell w100">--</div>
                    <div class="cell w100">和平均</div>
                    <div class="cell w100">均平均</div>
                    <div class="cell w100">差平均</div>
                    <div class="cell w100">首平均</div>
                    <div class="cell w100">尾平均</div>
                    <div class="cell w100"></div>
                    <div class="cell w200" style="border:none;"></div>
                </div>`;
        }

        // 畫出 zzz 的內容
        html += `<div class="row">`;
        // 假設 zzz[i] 是一個陣列，我們把前 10 個資料填進去
        for (let j = 0; j < 10; j++) {
            let val = zzz[i][j] || ""; 
            html += `<div class="cell w100">${val}</div>`;
        }
        html += `<div class="cell w200" style="border:none;"></div></div>`;
    }

    document.getElementById('table-area').innerHTML = html;
}
</script>

</body>
</html>
