<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>539 數據分佈 - 純白簡約版</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://88ll88.github.io/888/ddd.js"></script>
    <style>
        /* 基礎佈局與對齊 */
        body {
            background-color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        /* 右上角切換按鈕 */
        #toggle-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 10px;
            background-color: #e31919;
            color: white;
            border: 1px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        /* 表格容器 */
        #table-container { width: 1200px; margin: 0px auto; }
        
        table { 
            border-collapse: collapse; 
            table-layout: fixed; 
            width: 1200px; 
            text-align: center; 
            font-size: 15px;
            background-color: #fff; /* 主區底色全白 */
        }
        
        tr { height: 25px; }
        
        /* 單元格樣式 */
        td { 
            border: 0.5px solid #eee; /* 極細淺灰邊框 */
            padding: 0; 
            box-sizing: border-box; 
        }

        /* 標題與日期列 */
        .header { background-color: #000; color: white; font-weight: bold; }
        .date-cell { background-color: #f9f9f9; } /* 日期欄微灰色區隔 */

        /* 紅圈樣式 */
        .num-circle-red {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 22px;
            height: 22px;
            background-color: red;
            color: white;
            border-radius: 50%;
            font-size: 15px;
            font-weight: bold;
        }

        /* 篩選模式：只留相連的紅圈背景 */
        .filter-mode .not-connected {
            background-color: transparent !important;
            color: #ccc !important; /* 沒相連的號碼變淡灰文字 */
            border: none;
        }
    </style>
</head>
<body>
<script src="nav.js"></script>
<button id="toggle-btn" onclick="toggleFilter()">只看連莊橫連</button>

<div id="table-container">
    <table>
        <thead>
            <tr class="header">
                <td style="width: 100px">日期</td>
                <td style="width: 100px">開獎號碼</td>
                <script>
                    for (var i = 1; i <= 39; i++) {
                        document.write('<td style="width: 25px">' + String(i).padStart(2, "0") + '</td>');
                    }
                </script>
                <td style="width: 25px">#</td>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
    </table>
</div>

<script>
    var isFilterMode = false;

    function toggleFilter() {
        isFilterMode = !isFilterMode;
        var btn = document.getElementById('toggle-btn');
        btn.innerText = isFilterMode ? "恢復顯示全部" : "只看連莊橫連";
        document.body.classList.toggle('filter-mode');
    }

    function renderTable() {
        var tbody = document.getElementById('data-body');
        var html = '';

        if (typeof zzz !== 'undefined') {
            // 決定顯示範圍
            var remaining = new Set();
            for (var n = 1; n <= 39; n++) remaining.add(String(n).padStart(2, '0'));
            var lastIndex = 0;
            for (var i = 0; i < zzz.length; i++) {
                zzz[i][1].forEach(num => remaining.delete(num));
                lastIndex = i;
                if (remaining.size === 0) break;
            }

            for (var j = 0; j <= lastIndex; j++) {
                var row = zzz[j];
                var dateStr = row[0];
                var aryNums = row[1];
                
                var prevRowNums = (zzz[j - 1]) ? zzz[j - 1][1] : [];
                var nextRowNums = (zzz[j + 1]) ? zzz[j + 1][1] : [];

                html += '<tr>';
                html += `<td class="date-cell">${dateStr}</td>`;
                html += `<td class="date-cell">${aryNums.join(",")}</td>`;

                for (var n = 1; n <= 39; n++) {
                    var target = String(n).padStart(2, '0');
                    var targetLeft = String(n - 1).padStart(2, '0');
                    var targetRight = String(n + 1).padStart(2, '0');

                    if (aryNums.includes(target)) {
                        // 判定是否相連 (橫連或直連)
                        var isHorz = aryNums.includes(targetLeft) || aryNums.includes(targetRight);
                        var isVert = prevRowNums.includes(target) || nextRowNums.includes(target);
                        var connClass = (isHorz || isVert) ? "" : "not-connected";

                        html += `<td><span class="num-circle-red ${connClass}">${target}</span></td>`;
                    } else {
                        // 遺漏值全空白，不填入任何數字或背景色
                        html += `<td></td>`;
                    }
                }
                html += `<td class="date-cell">${j + 1}</td>`;
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }
    }

    window.onload = renderTable;
</script>

</body>
</html>
