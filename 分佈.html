<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script src="https://88ll88.github.io/888/ddd.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        #table-container { width: 1200px; margin: auto auto; }
        table { border-collapse: collapse; table-layout: fixed; width: 1200px; text-align: center; font-size: 14px; background: #e7e6e6}
        
        /* 統一高度與邊框 */
        tr { height: 25px; }
        td { border: 0.5px solid #ccc; padding: 0; box-sizing: border-box; line-height: 25px; }
        
        /* 標題列專用樣式 */
        .header-row { background-color: #000; color: white; }
        .header-row td { border: 1px solid white; }
        .sat-red { color: #e31919; font-weight: bold; }
        .sat-green { color: #57b31b; font-weight: bold; }
        /* 紅圈樣式 */
        .red-circle {
            display: inline-block;
            width: 22px;
            height: 22px;
            line-height: 22px;
            background-color: red;
            color: white;
            border-radius: 50%;
            font-weight: bold;
        }
        .dot-red {
    display: inline-block; /* 必須加這行，寬高才有效 */
    width: 12px;
    height: 12px;
    background-color: red;
    border-radius: 50%;
}
.num-circle-red {
    display: inline-flex;    /* 使用 flex 讓號碼置中 */
    justify-content: center; /* 水平置中 */
    align-items: center;     /* 垂直置中 */
    
    width: 24px;             /* 圓圈寬度 */
    height: 24px;            /* 圓圈高度 */
    
    background-color: red;   /* 紅色實心底 */
    color: white;            /* 號碼文字顏色變白色，才看得清楚 */
    
    border-radius: 50%;      /* 變成正圓形 */
    font-size: 12px;         /* 數字大小 */
    font-weight: bold;       /* 數字加粗 */
}

    </style>
</head>
<body>

<script src="nav.js"></script>

<div id="table-container">
    <table>
        <!-- 獨立的標題列 (thead) -->
        <thead>
            <tr class="header-row">
                <td style="width: 100px">日期</td>
                <td style="width: 100px">開獎號碼</td>
                <script>
                    // 這裡只單純產生標題的 01-39 欄位
                    for (var i = 1; i <= 39; i++) {
                        document.write('<td style="width: 25px">' + String(i).padStart(2, "0") + '</td>');
                    }
                </script>
                <td style="width: 25px">#</td>
            </tr>
        </thead>
        
        <!-- 數據存放區 (tbody) -->
        <tbody id="data-body">
            <!-- JavaScript 會把 1-20 期數據填在這裡 -->
        </tbody>
        <tfoot>
            <tr>               
                <td colspan=2 style="width:200px; background:#000;color:#fff;"></td>
               <script>
                    for(var q=1;q<=39;q++){
                          document.write('<td style="width: 25px; background:#000; color:#fff;">' + String(q).padStart(2, "0") + '</td>');
                    }                 
                </script>
                <td style="width:25px; background:#000;"></td>
            </tr>
            </tfoot>
        </table>
</div>

<script>
function renderTable() {
        var tbody = document.getElementById('data-body');
        var html = '';
        var nums=[];
        if (typeof zzz !== 'undefined') {
                var count = Math.min(zzz.length, 25); 
                var stats = Array(40).fill(0); 
                for (var j = 0; j < count; j++) {
                        var row = zzz[j];
                        var dateStr = row[0];
                        var aryNums = row[1]; // 這裡是陣列格式的號碼
                        var numsText = aryNums.join(","); // 這是顯示用的字串
                        var cls = j == 0 ? 'sat-red' : (dateStr.includes("六") ? 'sat-green' : '');                    
                        html += '<tr>';
                        html += `<td class="${cls}">${dateStr}</td>`;                   
                        html += `<td class="${cls}">${numsText}</td>`; 
                        for (var n = 1; n <= 39; n++) {
                                var target = String(n).padStart(2, '0');
                                if (aryNums.includes(target)) {
                                         stats[n]++; // 統計累加
                                         html += '<td><span class="dot-red"></span></td>';
                                 } else {
                                               html += '<td></td>';
                                 }
                          }
                          html += '<td>' + (j + 1) + '</td>';
                          html += '</tr>';
                  } 
                  html += '<tr style="background:#f9f9f9; font-weight:bold;">';
                  html += `<td colspan="2">合計出現次數 (共 ${count} 期)</td>`;
               for (var i = 1; i <= 39; i++) {
                      html += `<td style="color:blue;">${stats[i]}</td>`;
               }
               html += '<td>-</td>'; 
               html += '</tr>';              // 將組合好的 HTML 放入 tbody
               tbody.innerHTML = html;
        }
}
    window.onload = renderTable;
</script>

</body>
</html>
