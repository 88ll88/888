<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 引入數據源 -->
    <script src="https://88ll88.github.io/888/ddd.js"></script>
    <link rel="stylesheet" href="style.css">    
    <style>
    <style>
        #table-container { 
                  width: 1200px; 
                  margin: auto auto; 
        }
        table { 
                  border-collapse: collapse; 
                  table-layout: fixed; 
                  width: 1200px; 
                  text-align: center; 
                  font-size: 15px; 
                  background: #e7e6e6
         }
        
        /* 統一高度與邊框 */
        tr { 
                  height: 25px; 
        }
        td { 
                  border: 0.5px solid #ccc; 
                  padding: 0; 
                  box-sizing: border-box; 
                  line-height: 25px; 
        }

        .header { 
                  background: #333; 
                  font-weight: bold; 
        }
        .win-red { 
                  color: #ff4d4d; 
                  font-weight: bold; 
        } 
    </style>
</head>
<body>
<script src="nav.js"></script>
<div id="table-container">
    <table id="target-table">
        <thead>
            <tr class="header">
                <td style="width: 100px;background:#484944; color:#fff;border:1px solid #fff">日期</td>
                <td style="width: 100px;background:#484944; color:#fff;border:1px solid #fff">開獎號碼</td>
                <td style="width: 260px;background:#484944; color:#fff;border:1px solid #fff">拖牌1</td>
                <td style="width: 260px;background:#484944; color:#fff;border:1px solid #fff">拖牌2</td>
                <td style="width: 260px;background:#484944; color:#fff;border:1px solid #fff">拖牌2</td>
                <td style="width: 220px;background:#484944; color:#fff;border:1px solid #fff">結果</td>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
function getTop(n) {
            let target = String(n).padStart(2, '0');
            let stats = new Array(40).fill(0);
            let max = 0, topNum = "01";
            for (let i = zzz.length - 1; i > 0; i--) {
                         if (zzz[i][1].includes(target)) {
                                     zzz[i - 1][1].forEach(v => {
                                                  let val = parseInt(v);
                                                  if (val >= 1 && val <= 39) {
                                                               stats[val]++;
                                                               if (stats[val] > max) {
                                                                           max = stats[val];
                                                                           topNum = String(val).padStart(2, '0');
                                                               }
                                                  }
                                      });
                         }
           }
           return topNum;
}
function renderAll() {
          const tbody = document.getElementById('table-body');
          if (!tbody || typeof zzz === 'undefined') return;
          let html = '';
          for (let i = 0; i < 25; i++) {
                       if (!zzz[i]) break;
                       let date = zzz[i][0];
                       let nums = zzz[i][1];
                       let nextNums = (i > 0) ? zzz[i-1][1] : []; 
                       let t1_list = nums.map(n => ({ org: n, res: getTop(n) }));
                                    let t2_list = t1_list.map(item => ({ org: item.res, res: getTop(item.res) }));
                                    let t1_html = t1_list.map(item => {
                                                 let isHit = nextNums.includes(item.res);
                                                 return `(${item.org})<span class="${isHit ? 'win-red' : ''}">${item.res}</span>`;
                                    }).join(",");
                       let t2_html = t2_list.map(item => {
                                    let isHit = nextNums.includes(item.res);
                                    return `(${item.org})<span class="${isHit ? 'win-red' : ''}">${item.res}</span>`;
                       }).join(",");
                       let hitNums = [];
                       [...t1_list, ...t2_list].forEach(item => {
                                    if (nextNums.includes(item.res) && !hitNums.includes(item.res)) {
                                                  hitNums.push(item.res);
                                     }
                       });
                       let resultDisplay = "";
                       if (i === 0) {
                                     let waitNums = [...new Set([...t1_list.map(x=>x.res), ...t2_list.map(x=>x.res)])];
                                     resultDisplay = `<span style="color:#aaa">待開獎 | ${waitNums.slice(0,3).join(",")}...</span>`;
                       } else {
                                     resultDisplay = hitNums.length > 0 ? hitNums.join(",") : "—";
                       }
                       html += `<tr>
                       <td>${date}</td>
                       <td>${nums.join(",")}</td>
                       <td>${t1_html}</td>
                       <td>${t2_html}</td>
                       <td>${resultDisplay}</td>
                       </tr>`;
             }
             tbody.innerHTML = html;
}
window.onload = renderAll;
</script>
</body>
</htm>
